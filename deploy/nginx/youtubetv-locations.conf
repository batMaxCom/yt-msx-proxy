# Location rules shared by the :8080 and :443 server blocks.
# Included from each server block; not a .conf file so the conf.d/*.conf glob
# in nginx.conf does not try to load it at http level.

# --- media relay: stream straight through, never buffer -------------------
# proxy_buffering off is the important one. With buffering on, nginx reads a
# whole range response into memory before forwarding the first byte to the
# client, which adds a full segment of latency and defeats streaming.
location ~ ^/(api/stream/|api/hls/) {
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;

    proxy_buffer_size 16k;
    proxy_buffers 8 32k;

    # These bytes are already H.264/VP9/AV1 - compressing them only burns CPU.
    gzip off;

    proxy_pass http://youtubetv_backend;
}

# --- images relayed through the backend's on-disk cache --------------------
location /img/ {
    proxy_buffering off;
    proxy_pass http://youtubetv_backend;
}

# --- everything else: index.html, app bundle, JSON APIs, /proxy ------------
# Buffering stays on here. The client speaks HTTP/2 or HTTP/3 to nginx and
# nginx coalesces many upstream HTTP/1.1 responses into a few streams, which
# is what removes the browser's 6-connections-per-host ceiling and lets the
# player keep enough data in flight to fill a high-RTT link.
location / {
    proxy_buffering on;
    proxy_buffers 16 64k;
    proxy_busy_buffers_size 128k;

    proxy_pass http://youtubetv_backend;
}
