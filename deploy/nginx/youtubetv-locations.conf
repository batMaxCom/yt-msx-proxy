# Location rules used by the :8080 server block.
# Included from the server block; not a .conf file so the conf.d/*.conf glob
# in nginx.conf does not try to load it at http level.

# --- media relay: stream straight through, never buffer -------------------
# proxy_buffering off is the important one. With buffering on, nginx reads a
# whole range response into memory before forwarding the first byte to the
# client, which adds a full segment of latency and defeats streaming.
location ~ ^/(api/stream/|api/hls/) {
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;

    proxy_buffer_size 16k;
    proxy_buffers 8 32k;

    # These bytes are already H.264/VP9/AV1 - compressing them only burns CPU.
    gzip off;

    proxy_pass http://youtubetv_backend;
}

# --- images relayed through the backend's on-disk cache --------------------
location /img/ {
    proxy_buffering off;
    proxy_pass http://youtubetv_backend;
}

# --- everything else: index.html, app bundle, JSON APIs, /proxy ------------
# Buffering stays on here: text responses are small, and buffering keeps the
# backend's event loop free while nginx dribbles bytes out to a slow TV client
# over the long-haul leg.
location / {
    proxy_buffering on;
    proxy_buffers 16 64k;
    proxy_busy_buffers_size 128k;

    proxy_pass http://youtubetv_backend;
}
