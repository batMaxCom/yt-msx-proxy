# TLS + HTTP/2 + HTTP/3.
#
# This is the mode that actually removes TCP-over-TCP: the client link becomes
# QUIC (UDP), whose streams recover from loss independently, so a dropped packet
# on the long-haul leg no longer freezes the server's TCP connection to
# YouTube. HTTP/2 additionally lets every player range request share one
# connection instead of the browser's 6-per-host cap.
#
# Enabled by the entrypoint only when /etc/nginx/certs/fullchain.pem exists.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;

    # HTTP/3 on the same UDP port. reuseport lets the kernel spread QUIC
    # connections across workers.
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;

    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Advertise HTTP/3 so browsers upgrade on the first visit.
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header Strict-Transport-Security "max-age=86400" always;

    # QUIC retry: a token-validated retry stops address-validation spoofing.
    quic_retry on;
    # Larger GSO segments cut per-packet overhead, which matters on a
    # high-RTT link where syscalls are the expensive part.
    quic_gso on;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/youtubetv-locations.conf;
}
