# TLS + HTTP/2 on :443.
#
# QUIC/HTTP/3 is gone from this deployment: every client is the 2016 TV app,
# which only speaks HTTP/1.1 over plain HTTP on :8080. What remains here is an
# HTTPS front (HTTP/2 on TCP) for the rare case a client insists on TLS.
#
# Enabled by the entrypoint only when /etc/nginx/certs/fullchain.pem exists.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;

    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=86400" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/youtubetv-locations.conf;
}