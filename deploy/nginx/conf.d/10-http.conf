# The only server block: plain HTTP on :8080, which is the one entry point the
# TV client uses. TLS/HTTP/2/QUIC are gone (the 2016 TV app speaks HTTP/1.1).
#
# You get nginx-level brotli/gzip, sendfile offload, request coalescing and the
# removal of Node from the data path.
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    include /etc/nginx/youtubetv-locations.conf;
}