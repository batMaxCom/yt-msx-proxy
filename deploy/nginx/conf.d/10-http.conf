# Plain HTTP fallback for hosts that cannot terminate TLS yet.
#
# Browsers do not speak h2c, so there is no HTTP/2 or HTTP/3 here. You still
# get nginx-level brotli/gzip, sendfile offload, request coalescing and the
# removal of Node from the data path - but the TCP-over-TCP problem stays.
# Mount a certificate to switch to 20-https.conf.
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    # acme-challenge for certbot's webroot mode.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/youtubetv-locations.conf;
}
