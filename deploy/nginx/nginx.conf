# Main nginx config for 2016YouTubeTV.
#
# Why this file exists: the server sits abroad, and in the relay fallback the
# client cannot reach YouTube directly, so every video byte has to be proxied.
# Relaying through Node means the client's long-haul TCP connection carries the
# server's own TCP connection to YouTube inside it - TCP-over-TCP, where a lost
# packet on the outer connection stalls the inner one. nginx handles that byte
# path with sendfile/splice in the kernel, so one stalled connection no longer
# blocks the Node event loop.
#
# TLS/HTTP/2/QUIC are all gone: the only client in production is the 2016 TV app,
# which speaks plain HTTP/1.1 over :8080. conf.d/ therefore only has the plain
# HTTP front on :8080 plus the backend upstream.

user  nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # The Node backend already logs every request; stay quiet unless you are
    # debugging the front itself.
    access_log off;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    # Long-haul links need large socket buffers to keep the pipe full. These
    # are upper bounds; Linux autotunes below them via net.ipv4.tcp_rmem.
    client_body_buffer_size 256k;
    client_max_body_size 16m;
    output_buffers 4 512k;

    keepalive_timeout 75s;
    keepalive_requests 10000;

    server_tokens off;

    # The HLS segment URLs are a full googlevideo URL, percent-encoded, inside
    # the request path. They routinely exceed the default 8k header limit.
    large_client_header_buffers 4 16k;

    # --- compression -------------------------------------------------------
    # app-prod.js alone is ~1.3 MB and the image cache ~39 MB. Compressing the
    # text/JSON path is the biggest single win for interface load time; on the
    # current bundle gzip alone removes 80% of app-prod.js and 85% of
    # app-prod.css.
    # Video and HLS segments are excluded in the location blocks: they are
    # already compressed, and spending CPU on them would only add latency.
    #
    # Brotli would shave another 10-15% off JS/CSS, but it is not in the
    # official nginx image and has to be compiled in
    # (--with-http_brotli_module). Referencing it here makes nginx refuse to
    # start, so it is left out deliberately. Revisit only if you switch to a
    # custom nginx build.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/manifest+json
        application/vnd.apple.mpegurl
        application/x-mpegurl
        image/svg+xml;

    # Empty Connection + keepalive upstream: without this nginx opens a new TCP
    # connection to Node per request and the upstream pool is useless.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Port  $server_port;

    proxy_connect_timeout 15s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    include /etc/nginx/conf.d/*.conf;
}
