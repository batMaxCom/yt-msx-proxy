# Applied inside the container (docker run --sysctl) or on the host.
#
# The client link is long-haul and lossy. Three things are worth changing:
#
#   tcp_congestion_control=bbr
#       Cubic/reno lose most of the link to a single loss event. BBR keeps
#       modelling the bottleneck and ramps back up instead of halving the
#       window every time a packet drops - the single biggest OS-level win on
#       a lossy route.
#
#   rmem_max / wmem_max + tcp_rmem / tcp_wmem
#       To fill a 20 Mbit/s link at 200 ms RTT you need ~500 KB in flight. The
#       default 64 KB receive buffer caps you well below that. Raising the
#       ceilings lets tcp_moderate_rcvbuf autotune up to what the path allows.
#
#   tcp_slow_start_after_idle=0
#       The player opens and closes range requests constantly. Without this,
#       every idle gap drops the connection back into slow start, which is
#       brutal when the gaps are hundreds of milliseconds.
#
#   notifiers=1
#       Enables loss notification, which BBR uses to react to congestion.

net.ipv4.tcp_congestion_control = bbr
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_moderate_rcvbuf = 1
net.core.netdev_max_backlog = 5000
net.ipv4.tcp_notifiers = 1
